name: MassPermits weekly data refresh

# Fully hosted refresh: fetch the scraper engine (kept OFF this public repo — it
# streams from private R2 via the OIDC-gated /api/get-engine), scrape fresh MA
# permits on a GitHub runner, build the customer bundles, and hand them back to
# R2 via /api/upload-bundle. Runs Mondays 09:00 UTC — three hours BEFORE the
# 12:00 UTC weekly-feed send, so subscribers always get same-morning data.
# No local machine involved; no secrets exist anywhere in this repo (OIDC only).
# Failures self-report to R2 refresh-status.json (Actions logs need admin auth).

# engine v31 (2026-08-01): CAPTURE EVERYWHERE + FEED/SCHEMA/CTA REPAIR.
# (a) The free town-alert signup was live on ONE page type — /permits/<town>,
# 302 of 2,179 indexed pages. It now also renders on trade×town, cost pages,
# the 141 town guides and every /news/ brief: ~1,940 pages of capture instead
# of 302, for code that was already written.
# (b) The public feeds were unusable as a syndication asset and were verified
# so: /feed/permits.json served 100 items that resolved to 35 URLs, all from a
# SINGLE date, with "Project value $0" on every row (valuation is genuinely
# absent for ~78% of towns, and the generator printed the 0 anyway). Feeds now
# draw from a rolling 30-day window with a per-town cap and dedupe, omit value
# rather than publish a false $0, and link the town+trade page when one exists.
# A registry or aggregator that opens the feed no longer concludes it's broken.
# (c) Dataset JSON-LD: all ~140 town pages advertised the SAME two global feed
# URLs, reading as 140 copies of one dataset. Each now carries its own feed,
# url, identifier, license, per-page temporalCoverage (computed from that
# page's own rows — a global span would claim coverage the town lacks),
# variableMeasured and catalog membership. Google Dataset Search needs no
# account, so this is a channel we can actually open ourselves. Each town also
# now ships its OWN distributions — /feed/<town>.json and /feed/<town>.csv —
# because a dataset with no distinct download isn't a dataset. Masked street,
# trade, date, value; never house number, owner or contractor (that withheld
# identity IS the paid product). Plus /catalog.json, a DCAT-US index of all ~140
# town datasets that CKAN/DKAN/udata harvesters already know how to read, and
# WebSub hub declaration + a weekly publish ping.
# (d) Every CTA on 2,000+ pages pointed at a bare "/", throwing away the trade
# and town the visitor had just searched for; the homepage then asked them to
# re-declare it. CTAs now carry ?trade=&area=#sample and index.html prefills
# its selects from them — which also means Stripe's client_reference_id finally
# records which page produced a sale.
# ALSO (site repo, not engine): 404.html. Cloudflare Pages was serving
# index.html with HTTP 200 + "index,follow" for EVERY unknown path, an
# unbounded soft-404 space next to a 2,176-URL sitemap.
#
# v30 (2026-07-30): FREE TOWN-ALERT TIER — the funnel widener. Every
# /permits/<town> page now carries a free weekly signup ("Get <Town> permits
# free, every Monday") posting to /api/newsletter with the town slug. Until now
# 2,000+ indexed pages offered exactly ONE action (pay $49/$99), so organic
# visitors who weren't ready to buy simply left. newsletter.js stores the town in
# customMetadata; newsletter-send.js scopes each reader's Monday digest to their
# own town (built once per town, not per reader, to stay inside the subrequest
# budget; empty town falls back to the statewide roundup rather than sending a
# blank email). Double opt-in, one-click unsubscribe, honeypot + daily cap all
# inherited. v29: Patch coverage gate. Patch only has sites for 49 of
# our 140 towns (probed live: Yarmouth/Dennis/Chatham + 88 others 404), so the
# pack was picking towns with nowhere to post. patch_pack now selects only from
# data/patch_towns.json and every picked slug is verified live.
# v28: Patch.com weekly pack (patch_pack.py). Picks the 2-3
# most NEWSWORTHY towns from the week (ranked on real movement, not town size),
# writes each as a resident-facing local-news item with masked streets, and
# emails a paste-ready pack to the owner. Deliberately human-posted: one real
# Patch account, one town per post — a multi-town blast is spam and would cost
# the backlinks. Honesty guards: never quotes a >80% swing (municipal batch
# processing skews single weeks — compares to the 4-week average instead),
# suppresses outlier valuations, drops mangled street names, self-checks length
# and masking before emitting. v27: SEO batch 2. NEW cost pages
# /permits/<town>-<trade>-cost — homeowner "how much does <trade> cost in
# <town>" intent from real declared permit values (data-gated >=8 valued rows,
# ~160+ pages, median + 25/75 range), redirecting to the contractor CTA; linked
# from the trade×town page. Guide titles reframed to "<Town> Contractor Guide —
# Where the Work Is" so they stop cannibalizing the /permits/<town> data page
# for the "<town> building permits" query. v26: SEO deep-audit fixes. NEW region×trade pages
# (/roofing-leads-cape-cod etc. — ~29+ high-intent commercial pages filling the
# town→statewide tier gap, all data-gated + linked from statewide pages). Trade
# acronym casing fixed (HVAC not "hvac") across every meta/intro/FAQ. Trade×town
# pages gain reciprocal+lateral links (guide, sibling trades, same trade nearby,
# statewide). Statewide pages cross-link other trades + their regions. Schema:
# Article gains image/datePublished/publisher.logo, Dataset gains feed
# distribution, Org gains logo/email/areaServed; og:image (og.png) sitewide.
# pt-BR lang on Portuguese guide sections. Homepage internal-link block.
# v25 (2026-07-24): SEO RANKING push — internal-link graph so the 140
# guides stop being islands: each links to 6 nearby-town guides + its town's
# trade money-pages (spreads rank equity across the whole set, not just
# externally-linked Chatham). Sitemap now carries <lastmod> (weekly build date =
# honest freshness signal). Plus IndexNow: every URL pushed to Bing/Yandex each
# run (key file 7f0001...e302.txt in repo root) for fast crawl/index.
# v24 (2026-07-22): COMPLETE guide coverage — 140/140 towns have a
# contractor guide (/guides/<town>-building-permits). Final 28 S-Y towns
# written by a scoped fan-out (self-grounded against live pages), validated
# (word count, no ext links/emails/phones, comparison-accuracy prompt).
# v23 (2026-07-21): STATEWIDE guide coverage — 107 per-town contractor
# guides (/guides/<town>-building-permits): the 14 curated bilingual target-town
# guides + 93 English guides for every other covered town, each written from a
# live fetch of that town's real trade mix (self-grounded agents). 33 towns hit
# the session credit ceiling mid-run and backfill later via workflow resume.
# v22 (2026-07-21): per-town CONTRACTOR GUIDES + PermitEyes recency cap.
# 14 evergreen bilingual (EN + Brazilian-Portuguese) SEO guides at
# /guides/<town>-building-permits for the highest-value Portuguese/Brazilian
# audience towns (New Bedford, Fall River, Marlborough, Framingham, Everett,
# Hudson, Taunton, Stoughton, Dartmouth, Peabody, Chelsea, Ashland, Milton,
# Dracut) — agent-authored, adversarially verified, grounded in each town's real
# trade mix, data/town_guides.json in the tarball. Town pages + hub link them.
# ALSO: PermitEyes fetcher now applies the 180-day recency window (matching
# OpenGov) — low-volume towns (Avon/Hanson/West Bridgewater) were padding
# "recent" leads with 1-2yr-old permits; now capped. Verified 0 stale.
# v21 (2026-07-20): +16 PermitEyes towns -> 140 sources. Taunton (publishes
# project VALUES), Attleboro, Milton, Randolph, Stoughton, Easton, Bridgewater,
# West Bridgewater, Hanson, Avon, Cohasset, Norwell, Mansfield, Foxborough
# (values too), Fairhaven, Sandwich. fetch_permiteyes now supports 3 ajax endpoint
# variants + valuation columns + the sane-date guard; every layout live-validated
# (Other <10% all towns). Bare-number address guard added. Boundaries + regions
# updated. (Also: /api/my-leads self-serve download button — see functions.)
# Citizenserve cities (Lawrence/Brockton/Medford/Revere/Somerville) probed and
# SHELVED — reCAPTCHA v3 gated, not pursued (no bot-detection bypass).
# v20 (2026-07-20): +13 OpenGov towns -> 124 sources. New Bedford + Fall
# River (South Coast cities, verified same-day data) and 11 Worcester County
# towns re-probed clean after the future-date guard (Dudley, Grafton, Harvard,
# Lunenburg, Mendon, Westminster [trades only — no Building type], Gardner,
# Paxton, Rutland, Millbury, Douglas). Skip-regex now drops vacant-building
# registrations + demolition-delay reviews. Boundaries fetched for all 13;
# regions updated (Central MA +10, MetroWest +Harvard, South Coast +2 cities).
# Full recon detail: PermitPulse/data/expansion_recon_2026-07-20.json (also
# maps 17 PermitEyes towns for the NEXT batch + 5 Citizenserve cities).
# v19: weekly per-town permit briefs at /news/<town>/<week>
# (blog_build.py + blog_voice.py — data-driven local-news pages, ~30/week, gated
# at >=6 filings; fact-aware phrasing rotation, first-write-wins archives, whole
# /news/ tree re-added to the sitemap every run). Town pages link their brief
# archive. Junk city strings excluded from town pages and briefs alike.
# v18: town names across the public site now LINK to their
# /permits/<town> pages — homepage teaser rows carry an "s" slug (only when the
# page exists; villages link to their own page, Hyannis -> /permits/hyannis)
# and statewide trade pages gain a linked Town column. The homepage region
# filter is rebuilt from a full 111-town map (export_lander._REGIONS): "Cape
# Cod & Islands" now spans all 18 Cape+Vineyard towns instead of only
# Barnstable's lagging PDF (why the Cape filter showed June 30 while
# /permits/chatham was current), plus new MetroWest/North Shore/Central/
# Western MA buckets. seo_build imports the same map, so hub + trade-page +
# nearby-town copy stops calling Springfield "Greater Boston". Junk city
# strings from address-parsing bleed ("Unit #A") no longer surface as towns in
# the homepage teaser. v17: all 111 municipal outlines (Census "<name> Town"
# basenames; 4-pt ring floor for rectangular towns). v16: outlines + $0-column
# fix + per-town permit maps.
on:
  schedule:
    - cron: "0 9 * * 1"    # Mondays 09:00 UTC (~4-5am ET)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-refresh.yml"   # first push = immediate live test

permissions:
  id-token: write    # OIDC — keyless auth to /api/get-engine + /api/upload-bundle
  contents: write    # heartbeat commit (prevents GitHub's 60-day cron auto-disable)

concurrency:
  group: weekly-refresh
  cancel-in-progress: false   # never let two refreshes interleave R2 writes

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch scraper engine (OIDC — engine is not in this repo)
        run: |
          ok=""
          for i in $(seq 1 10); do
            # mint per attempt — OIDC JWTs are short-lived (~5 min)
            OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masspermits-cron" | jq -r .value)
            if curl -fsS -H "Authorization: Bearer $OIDC" \
              -o engine.tar.gz https://masspermits.com/api/get-engine; then ok=1; break; fi
            echo "engine fetch attempt $i failed (a Pages deploy may be racing); retrying in 30s"
            sleep 30
          done
          [ -n "$ok" ] || { echo "::error::engine fetch failed after 10 attempts"; exit 1; }
          tar xzf engine.tar.gz && rm engine.tar.gz && ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape, quality-gate, build bundles
        run: |
          set -o pipefail
          python -u hosted_refresh.py 2>&1 | tee run.log

      # Uploads happen here via curl, NOT inside Python: Cloudflare's WAF 403s
      # Python-urllib PUTs (bot fingerprint) but passes curl. WEEKLY ships first
      # (the 12:00 UTC send reads it). This step only runs when the gate passed.
      - name: Ship bundles to R2 (curl + OIDC)
        run: |
          up() {
            OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masspermits-cron" | jq -r .value)
            curl -fsS -X PUT -H "Authorization: Bearer $OIDC" -H "Content-Type: $3" \
              --data-binary @"$1" "https://masspermits.com/api/upload-bundle?key=$2"
            echo "  shipped $2"
          }
          up "$(ls -t data/bundles/MassPermits-*-WEEKLY.zip  | head -1)" latest-weekly.zip  application/zip
          up "$(ls -t data/bundles/MassPermits-*-MONTHLY.zip | head -1)" latest-monthly.zip application/zip
          up "$(ls -t data/bundles/MassPermits-*-SAMPLE.zip  | head -1)" latest-sample.zip  application/zip

      # Status + full run log go to R2 even on failure — Actions logs need
      # repo-admin auth, R2 doesn't. This is the pipeline's black box, and
      # weekly-send checks status.json (ok + freshness) before mailing anyone.
      - name: Ship status + run log to R2 (always)
        if: always()
        run: |
          [ -f run.log ] || echo "(no run.log produced)" > run.log
          OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masspermits-cron" | jq -r .value)
          curl -fsS -X PUT -H "Authorization: Bearer $OIDC" -H "Content-Type: text/plain" \
            --data-binary @run.log "https://masspermits.com/api/upload-bundle?key=run-log.txt" || true
          if [ -f status.json ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
              --data-binary @status.json "https://masspermits.com/api/upload-bundle?key=refresh-status.json" || true
          fi

      # Keep the PUBLIC SITE fresh too: regenerate the masked teaser data.json
      # AND all ~200 programmatic SEO pages (fresh counts, sitemap, llms.txt)
      # from this week's scrape, commit to main -> Cloudflare Pages redeploys.
      # Weekly-changing content is a live-site signal to Google. (Does not
      # retrigger this workflow: its push trigger is paths-filtered to the yml.)
      - name: Refresh website teaser + SEO pages + report + video (commit to main)
        continue-on-error: true
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          python export_lander.py site/data.json
          python seo_build.py site
          # weekly per-town permit briefs (/news/<town>/) — runs AFTER seo_build
          # because it re-adds the whole /news/ tree to the sitemap seo_build
          # regenerates from scratch (a skipped run would deindex the archive).
          # Past weeks' briefs are first-write-wins and never touched. NEVER set
          # BLOG_ANCHOR here — it re-anchors every run to that past week.
          python blog_build.py site || echo "::warning::blog_build failed — briefs AND their sitemap entries missing this week"
          # Patch.com paste-ready pack (2-3 most newsworthy towns, written as
          # local news). Emailed to the owner below; posting is a human step by
          # design — one real account, one town per post, never a blast.
          python patch_pack.py || echo "::warning::patch_pack failed — no Patch pack this week"
          # weekly PR report page (masspermits.com/report/) + pitch digest artifacts
          python pr_report.py || echo "::warning::pr_report failed — report page not refreshed"
          if [ -f out/pr/report.html ]; then mkdir -p site/report && cp out/pr/report.html site/report/index.html; fi
          # weekly narrated data video (embedded on site + posted to Bluesky below)
          python video_report.py || echo "::warning::video render failed — keeping last week's video"
          if [ -f data/video/weekly_report.mp4 ]; then mkdir -p site/video && cp data/video/weekly_report.mp4 site/video/weekly_report.mp4; fi
          cd site
          git config user.name "masspermits-refresh-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "data+seo+report: weekly site refresh (automated)" && git push origin main \
            || echo "site unchanged — nothing to push"

      # IndexNow: proactively tell Bing/Yandex/Seznam/Naver (and, indirectly,
      # Google) about every URL each week so fresh guides/briefs get crawled in
      # hours instead of waiting on organic discovery. Key file is served from
      # the repo root (public by design). Runs from the freshly-built sitemap.
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: |
          KEY=7f0001add081ec7e0301b1a76611e302
          # extract every <loc> from the sitemap we just built + committed
          URLS=$(grep -oE '<loc>[^<]+</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' \
            | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY=$(python3 -c "import json,sys; u=json.load(sys.stdin); print(json.dumps({'host':'masspermits.com','key':'$KEY','keyLocation':'https://masspermits.com/'+'$KEY'+'.txt','urlList':u}))" <<< "$URLS")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json' --data "$BODY")
          echo "IndexNow submit: HTTP $code ($(echo "$URLS" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))') urls)"

      # WebSub: tell the public hub the feeds changed, so anyone subscribed gets
      # pushed instead of polling. Costs one request; expected traffic is small,
      # but it is a real no-account syndication rail and it runs itself.
      - name: Ping WebSub hub
        continue-on-error: true
        run: |
          for f in https://masspermits.com/feed.xml https://masspermits.com/feed/permits.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://pubsubhubbub.appspot.com/ \
              -d "hub.mode=publish" --data-urlencode "hub.url=$f")
            echo "WebSub publish $f -> HTTP $code"
          done

      # Weekly PR pitch digest -> owner's inbox (recipient hard-locked server-side).
      # He forwards the pitches he likes; nothing is ever auto-sent to outsiders.
      - name: Mail PR pitch digest to owner (OIDC)
        continue-on-error: true
        run: |
          [ -f out/pr/email_digest.html ] || { echo "no digest produced"; exit 0; }
          OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masspermits-cron" | jq -r .value)
          curl -fsS -X POST -H "Authorization: Bearer $OIDC" -H "Content-Type: text/html" \
            --data-binary @out/pr/email_digest.html \
            "https://masspermits.com/api/mail-owner?subject=$(python -c 'import urllib.parse;print(urllib.parse.quote("Weekly PR pitches — forward the ones you like"))')"

      # Patch pack -> owner's inbox, paste-ready. Deliberately NOT auto-posted:
      # Patch is one real account posting genuine local news, one town at a time.
      - name: Mail Patch pack to owner (OIDC)
        continue-on-error: true
        run: |
          [ -f out/patch/pack.html ] || { echo "no patch pack produced"; exit 0; }
          OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masspermits-cron" | jq -r .value)
          curl -fsS -X POST -H "Authorization: Bearer $OIDC" -H "Content-Type: text/html" \
            --data-binary @out/patch/pack.html \
            "https://masspermits.com/api/mail-owner?subject=$(python -c 'import urllib.parse;print(urllib.parse.quote("Patch pack — paste-ready local news, 3 towns"))')"

      # Weekly data video -> Bluesky (skips cleanly if creds absent)
      - name: Post weekly video to Bluesky
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE || 'masspermits.bsky.social' }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: |
          pip install "atproto>=0.0.55" >/dev/null 2>&1 || true
          python bsky_video_post.py || echo "::warning::bsky video post failed"

      # GitHub auto-disables scheduled workflows on public repos after 60 days
      # without repo activity. This commit after each successful run counts as
      # activity, so the cron can never silently die. Pushed to a dedicated
      # 'heartbeat' branch: no Pages rebuild, no workflow triggers.
      - name: Keep-alive heartbeat commit
        continue-on-error: true
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hb
          cd hb
          git config user.name "masspermits-refresh-bot"
          git config user.email "actions@github.com"
          date -u +"last successful refresh: %Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "heartbeat: weekly refresh succeeded"
          git push -f origin HEAD:refs/heads/heartbeat
